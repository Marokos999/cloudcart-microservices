name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services regardless of changes'
        required: false
        default: 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cloudcart

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.changes.outputs.catalog }}
      basket: ${{ steps.changes.outputs.basket }}
      discount-grpc: ${{ steps.changes.outputs.discount-grpc }}
      ordering: ${{ steps.changes.outputs.ordering }}
      payment: ${{ steps.changes.outputs.payment }}
      notification: ${{ steps.changes.outputs.notification }}
      inventory: ${{ steps.changes.outputs.inventory }}
      gateway: ${{ steps.changes.outputs.gateway }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            catalog:
              - 'src/Services/Catalog/**'
            basket:
              - 'src/Services/Basket/**'
            discount-grpc:
              - 'src/Services/Discount/**'
            ordering:
              - 'src/Services/Ordering/**'
            payment:
              - 'src/Services/Payment/**'
            notification:
              - 'src/Services/Notification/**'
            inventory:
              - 'src/Services/Inventory/**'
            gateway:
              - 'src/Gateway/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog
            dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
            changed: ${{ needs.detect-changes.outputs.catalog }}
          - service: basket
            dockerfile: src/Services/Basket/Basket.API/Dockerfile
            changed: ${{ needs.detect-changes.outputs.basket }}
          - service: discount-grpc
            dockerfile: src/Services/Discount/Discount.Grpc/Dockerfile
            changed: ${{ needs.detect-changes.outputs.discount-grpc }}
          - service: ordering
            dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
            changed: ${{ needs.detect-changes.outputs.ordering }}
          - service: payment
            dockerfile: src/Services/Payment/Payment.API/Dockerfile
            changed: ${{ needs.detect-changes.outputs.payment }}
          - service: notification
            dockerfile: src/Services/Notification/Notification.API/Dockerfile
            changed: ${{ needs.detect-changes.outputs.notification }}
          - service: inventory
            dockerfile: src/Services/Inventory/Inventory.API/Dockerfile
            changed: ${{ needs.detect-changes.outputs.inventory }}
          - service: gateway
            dockerfile: src/Gateway/CloudCart.Gateway/Dockerfile
            changed: ${{ needs.detect-changes.outputs.gateway }}
          - service: frontend
            dockerfile: frontend/cloudcart-angular/Dockerfile
            context: frontend/cloudcart-angular
            changed: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Skip if no changes
        if: matrix.changed != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No changes in ${{ matrix.service }}, skipping."

      - name: Log in to GHCR
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-image-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in values files
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          for service in catalog basket discount-grpc ordering payment notification inventory gateway; do
            VALUES_FILE="k8s/helm/values/${service}.yaml"
            if [ -f "$VALUES_FILE" ]; then
              sed -i "s/tag: .*/tag: \"${SHA}\"/" "$VALUES_FILE"
            fi
          done

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/values/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
